# Squash merges use the PR title as the commit message, and semantic-release derives the next
# version from it, so the title must be a conventional commit (e.g. "feat: add X").
name: PR title

on:
  pull_request_target: # safe here: this workflow never checks out or runs PR code
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            style
            revert
