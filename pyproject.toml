[project]
name = "keyveil"
version = "0.1.0"
description = "Localhost reverse proxy that injects API credentials held only in RAM into HTTP requests, so editors, agents and scripts never see or store them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []  # standard library only, on purpose
keywords = ["llm", "api-key", "credentials", "reverse-proxy", "secrets", "age", "yubikey", "ai-agents", "continue", "cline"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
keyveil = "keyveil.proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyveil"]
